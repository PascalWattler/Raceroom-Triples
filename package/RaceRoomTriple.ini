; RaceRoom Triples - example configuration.
; Keep this file next to d3d9.dll. Save as UTF-8 (plain text), not UTF-16.
; Restart the game after changes.
;
; The refresh rates are entries for the game's menu. They do NOT change the
; refresh rate of your monitors.

[Settings]
; true:  sizes must be exactly 48:9 (three 16:9 screens of the same size)
; false: allow custom sizes, for example bezel-corrected widths
StrictTripleAspect = true

; dx9:  the Direct3D 9 of Windows
; dxvk: the DXVK that RaceRoom ships in Game\x64dxvk.
; IMPORTANT: You need to start the game the "normal way",
;           not through Steam's DXVK launch option.
;           This is your dxvk switch if you want to use this wrapper. 
Renderer = dx9

[Modes]
; Total width x height = refresh rates in Hz
7680x1440 = 60,75,100,120,144
5760x1080 = 60,75,100,120,144
11520x2160 = 60,75,100,120,144
